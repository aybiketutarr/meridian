 md:()=>dl("meridian.md",`${mdBrand()}\n\n| ${t("rep.t.host")} | ${t("rep.t.os")} | ${t("rep.t.ports")} | ${t("rep.t.risk")} |\n|---|---|---|---|\n`+hosts.map(h=>`| ${mdx(h.ip)} ${mdx(h.name)} | ${mdx(h.os)} | ${h.ports.map(p=>p.port+"/"+mdx(p.service)).join(", ")} | ${score(h)} |`).join("\n")+`\n\n## ${t("rep.findings")}\n`+hosts.flatMap(h=>finds(h).map(f=>`- **${LBL[f.sev]}** ${mdx(f.t)} (${mdx(at(h,f))}): ${mdx(f.fix)}`)).join("\n")+`\n\n## ${t("rep.vulns")}\n`+vulnLines().map(({h,p,i})=>`- ${mdx(h.ip)}:${p.port} ${mdx(p.version)}: ${mdx(i.id)}${i.cvss!=null?" (CVSS "+i.cvss+")":""}${i.exploit?" ["+t("rep.exp")+"]":""}${i.kev?" ["+t("rep.kev")+"]":""}`).join("\n")+aiMd(),"text/markdown"),
 html:()=>dl("meridian.html",repDoc(),"text/html"),pdf:printReport,xml:()=>fetch("/api/xml/"+jid).then(r=>r.ok?r.text().then(x=>dl("meridian.xml",x,"application/xml")):toast(t("toast.noxml"))),
 ips:()=>navigator.clipboard.writeText(hosts.map(h=>h.ip).join("\n")).then(()=>toast(t("toast.ips"),true)).catch(()=>dl("meridian-ips.txt",hosts.map(h=>h.ip).join("\n"),"text/plain"))};
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#mn").classList.remove("open")});
$("#mn").querySelector("div").onclick=e=>{const f=e.target.dataset.f;if(f){EX[f]();$("#mn").classList.remove("open")}};
$("#wi").onchange=async e=>{if(!$("#ack").checked){toast(t("watch.auth"));e.target.value="0";return}
 const b={target:$("#t").value,profile:prof==="custom"?"quick":prof,ack:true,minutes:+e.target.value};let r=await api("/api/watch",b),d=await r.json();
 if(r.status===409&&d.error==="public"){if(!confirm(t("confirm.public.w"))){e.target.value="0";return}r=await api("/api/watch",{...b,public_ok:true});d=await r.json()}
 if(!r.ok){toast(emsg(d));e.target.value="0"}else toast(b.minutes?t("watch.started",{target:b.target,m:b.minutes}):t("watch.stopped"),true);pollAl()};
async function pollAl(){try{const a=await (await fetch("/api/alerts")).json();alerts=a.alerts;watches=a.watch;$("#wl").textContent=watches.length?t("watch.now",{list:watches.map(w=>t("watch.every",{target:w.target,m:w.every})).join(", ")}):"";const seq=a.seq??alerts.length,fresh=seen===null?0:Math.min(seq-seen,alerts.length);seen=seq;if(fresh>0){const nw=alerts.slice(-fresh);toast(alertText(nw[nw.length-1]));if(nfOn())nw.forEach(x=>{try{new Notification("Meridian",{body:alertText(x)})}catch(e){}})}render()}catch(e){}}
setInterval(pollAl,20000);pollAl();
$("#auto").onclick=async()=>{const d=await (await fetch("/api/net")).json();$("#t").value=d.cidr};
fetch("/api/history").then(r=>r.json()).then(l=>{$("#rt").innerHTML=[...new Set(l.map(x=>x.target))].map(t=>`<option value="${esc(t)}">`).join("")}).catch(()=>{});
{const lk=$("#lk");lk.checked=false;lk.onchange=async()=>{if(!lk.checked)return;lk.disabled=true;lk.checked=await askLookup();lk.disabled=false}}
(async()=>{try{const d=await (await fetch("/api/net")).json();if(d.cidr&&$("#t").value==="192.168.1.0/24")$("#t").value=d.cidr;
if(d.root===false)toast(t("root.hint."+(d.os||"linux")),true)}catch(e){}})();

function initLang(){let s="";try{s=localStorage.getItem("mr-lang")||""}catch(e){}
 const ks=Object.keys(LOCALES),find=c=>{c=String(c||"").toLowerCase();return ks.find(k=>k.toLowerCase()===c)||ks.find(k=>k.toLowerCase()===c.split("-")[0])};
 for(const c of [s,DEFLANG]){      /* English on first start; only a saved choice or --lang changes it */const m=find(c);if(m)return m}return "en"}
function buildPF(){$("#pf").innerHTML=PF.map(p=>`<button class="pf ${p[2]||""}" aria-pressed="${p[0]==prof}" data-p="${p[0]}"><svg class="i"><use href="#${p[1]}"/></svg><div><b>${esc(t("pf."+p[0]+".n"))}</b><span>${esc(t("pf."+p[0]+".d"))}</span></div></button>`).join("")}
function applyI18n(){document.documentElement.lang=LANG;
 $$("[data-i18n]").forEach(e=>e.textContent=t(e.dataset.i18n));
 $$("[data-i18n-ph]").forEach(e=>e.placeholder=t(e.dataset.i18nPh));
 $$("[data-i18n-title]").forEach(e=>e.title=t(e.dataset.i18nTitle));
 $$("[data-i18n-aria]").forEach(e=>e.setAttribute("aria-label",t(e.dataset.i18nAria)))}
function setLang(c,save){LANG=LOCALES[c]?c:"en";if(save)try{localStorage.setItem("mr-lang",LANG)}catch(e){}
 $("#lang").innerHTML=Object.keys(LOCALES).map(k=>`<option value="${esc(k)}">${esc(LOCALES[k]._name||k)}</option>`).join("");$("#lang").value=LANG;
 applyI18n();buildPF();pr();render();renderAI();if(!$("#p-his").classList.contains("hide"))loadHis()}
$("#lang").onchange=e=>setLang(e.target.value,true);
async function saveDev(b){try{const r=await api("/api/devices",b),d=await r.json();if(!r.ok){toast(emsg(d));return false}devs=d.devices||{};render();return true}catch(e){return false}}
document.addEventListener("change",e=>{const h=hosts.find(x=>x.ip===sel);if(!h)return;
 if(e.target.id==="dv-t")saveDev({key:devKey(h),trusted:e.target.checked});
 if(e.target.id==="dv-l")saveDev({key:devKey(h),label:e.target.value})});
document.addEventListener("click",e=>{if(e.target.id==="trustall"&&hosts.length)saveDev({trust:hosts.map(devKey)}).then(ok=>ok&&toast(t("dev.baseline.done",{n:hosts.length}),true))});
const nfOn=()=>{try{return localStorage.getItem("mr-notify")==="1"&&"Notification" in window&&Notification.permission==="granted"}catch(e){return false}};
{const nf=$("#nf");nf.checked=nfOn();
 nf.onchange=async()=>{if(!nf.checked){try{localStorage.setItem("mr-notify","0")}catch(e){}return}
  let ok=false;try{ok="Notification" in window&&(Notification.permission==="granted"||await Notification.requestPermission()==="granted")}catch(e){}
  nf.checked=ok;try{localStorage.setItem("mr-notify",ok?"1":"0")}catch(e){}if(!ok)toast(t("watch.notify.denied"))}}
try{$("#ol").checked=localStorage.getItem("mr-offline")==="1"}catch(e){}
fetch("/api/devices").then(r=>r.json()).then(d=>{devs=d.devices||{};render()}).catch(()=>{});

/* ---- AI analysis: the page only talks to this server; the server talks to the model (see ai.py) ---- */
let ai=null,aiRes=null,aiFor=null,aiBusy=false;
const aiHere=()=>aiRes&&aiFor===jid;
const aiSev=s=>SV[s]?LBL[SV[s]]:t("sev.info");
const aiBy=r=>t("ai.by",{model:r.model,provider:t("ai.p."+r.provider)});
const aiMd=()=>aiHere()?`\n\n## ${t("rep.ai")}\n${mdx(aiBy(aiRes))}\n\n${mdx(aiRes.summary)}\n\n`+aiRes.priorities.map(p=>`- **${mdx(aiSev(p.severity))}** ${mdx(p.host)} ${mdx(p.issue)}: ${mdx(p.fix)}`).join("\n"):"";
const aiHtml=()=>aiHere()?`<h2>${esc(t("rep.ai"))}</h2><p><i>${esc(aiBy(aiRes))}</i></p><p>${esc(aiRes.summary)}</p><ul>${aiRes.priorities.map(p=>`<li><b>${esc(aiSev(p.severity))}</b> ${esc(p.host)} ${esc(p.issue)} ${esc(p.fix)}`).join("")}</ul>`:"";
async function loadAI(){try{ai=await (await fetch("/api/ai")).json()}catch(e){ai=null}
 if(jid&&aiFor!==jid){try{const r=await fetch("/api/ai/result/"+jid);aiRes=r.ok?await r.json():null;aiFor=jid}catch(e){}}renderAI()}
let aiOther=false;
function aiModelField(){const mods=ai.models||[],sug=(ai.suggested||[]).filter(m=>!mods.includes(m)),cur=ai.model||(ai.cloud?ai.default_model:mods[0]||""),
 other=aiOther||(cur&&!mods.includes(cur)&&!sug.includes(cur)&&!(ai.suggested||[]).includes(cur)),o=m=>`<option value="${esc(m)}" ${!other&&cur===m?"selected":""}>${esc(m)}</option>`,
 g=(l,a)=>a.length?`<optgroup label="${esc(t(l))}">${a.map(o).join("")}</optgroup>`:"";
 return `<label>${esc(t("ai.model"))}<select id="ai-m">${ai.cloud?(ai.suggested||[]).map(o).join(""):g("ai.model.inst",mods)+g("ai.model.sugg",sug)}<option value="__other__" ${other?"selected":""}>${esc(t("ai.model.other"))}</option></select></label>`
 +(other?`<label>${esc(t("ai.model.name"))}<input id="ai-mc" value="${esc(aiOther?"":cur)}" placeholder="${esc(t("ai.model.ph"))}" maxlength="100" autocomplete="off" spellcheck="false"></label>`:"")
 +(ai.provider==="ollama"&&!other&&cur&&!mods.includes(cur)?`<p class="ainote">${esc(t("ai.model.pull",{m:cur}))}</p>`:"")}
function renderAI(){const el=$("#ai");if(!el||!ai)return;if(["ai-m","ai-mc","ai-k","ai-po"].includes(document.activeElement?.id))return;
 const loc=ai.provider&&!ai.cloud,can=ai.provider&&hosts.length&&last.status!=="running"&&!aiBusy;
 el.innerHTML=`<div class="card"><b>${esc(t("ai.title"))}</b><p class="mut">${esc(t("ai.desc"))}</p><div class="aig">
 <label>${esc(t("ai.provider"))}<select id="ai-p"><option value="">${esc(t("ai.p.off"))}</option>${ai.providers.map(p=>`<option value="${esc(p)}" ${ai.provider===p?"selected":""}>${esc(t("ai.p."+p))}</option>`).join("")}</select></label>
 ${ai.provider?aiModelField():""}
 ${loc?`<label>${esc(t("ai.port"))}<input id="ai-po" type="number" min="1024" max="65535" value="${+ai.port}"></label>`:""}
 ${ai.cloud?`<label>${esc(t("ai.key"))}<input id="ai-k" type="password" autocomplete="off" placeholder="${esc(t(ai.key?"ai.key.set":"ai.key.ph"))}"></label>`:""}</div>
 ${ai.provider?`<p class="ainote">${esc(t(ai.cloud?"ai.cloud.note":"ai.local.note"))}${ai.cloud&&ai.key_src==="env"?" "+esc(t("ai.key.env")):""}</p>`:""}
 <div class="hostbar">${ai.provider?`<button class="ghost" id="ai-s">${esc(t("ai.save"))}</button>`:""}${ai.cloud&&ai.key&&ai.key_src==="file"?`<button class="ghost" id="ai-c">${esc(t("ai.key.clear"))}</button>`:""}
 <button class="go" id="ai-r" ${can?"":"disabled"}>${esc(t(aiBusy?"ai.running":"ai.run"))}</button>${ai.provider&&!hosts.length?`<span class="mut">${esc(t("ai.noscan"))}</span>`:""}</div></div>`
 +(aiHere()?`<div class="card" style="margin-top:16px"><b>${esc(t("ai.summary"))}</b><p>${esc(aiRes.summary)}</p><div class="ainote">${esc(aiBy(aiRes))}</div>`
 +(aiRes.priorities.length?`<b>${esc(t("ai.prio"))}</b>`+aiRes.priorities.map(p=>`<div class="aip"><span class="badge b-${SV[p.severity]||"low"}">${esc(aiSev(p.severity))}</span> <b class="ip">${esc(p.host)}</b><p>${esc(p.issue)}</p><p class="mut">${esc(t("ai.fix"))}: ${esc(p.fix)}</p></div>`).join(""):"")+`</div>`:"")}
function askAI(d){return new Promise(res=>{const m=document.createElement("div"),p=t("ai.p."+d.provider);m.className="modal";
 m.innerHTML=`<div class="box" role="dialog" aria-modal="true" aria-labelledby="amt"><h3 id="amt">${esc(t("ai.cm.title",{provider:p}))}</h3><p>${esc(t("ai.cm.p1",{provider:p,model:d.model}))}</p><pre>${esc(JSON.stringify(d.payload,null,1))}</pre><p class="mut">${esc(t("ai.cm.p2"))}</p><div class="row"><button class="ghost" id="amn">${esc(t("ai.cm.no"))}</button><button class="go" id="amy">${esc(t("ai.cm.yes"))}</button></div></div>`;
 document.body.appendChild(m);const fin=v=>{document.removeEventListener("keydown",k);m.remove();res(v)},k=e=>{if(e.key==="Escape")fin(false)};
 document.addEventListener("keydown",k);$("#amy").onclick=()=>fin(true);$("#amn").onclick=()=>fin(false);$("#amn").focus()})}
async function aiCfg(b){try{const r=await api("/api/ai/config",b),d=await r.json();if(!r.ok){toast(emsg(d));return false}ai=d;return true}catch(e){return false}}
async function runAI(){if(aiBusy||!jid||!hosts.length)return;aiBusy=true;renderAI();
 try{const b={id:jid,lang:LANG};let r=await api("/api/ai/preview",b),d=await r.json();if(!r.ok){toast(emsg(d));return}
  if(d.cloud){if(!await askAI(d))return;b.consent=d.consent}
  r=await api("/api/ai/analyze",b);d=await r.json();if(!r.ok){toast(emsg(d));return}aiRes=d;aiFor=jid}
 catch(e){toast(t("err.ai_unreachable"))}finally{aiBusy=false;renderAI()}}
document.addEventListener("change",async e=>{if(e.target.id==="ai-p"){aiOther=false;if(await aiCfg({provider:e.target.value,model:""})){if(ai.provider&&!ai.cloud&&ai.models.length)await aiCfg({model:ai.models[0]});renderAI()}else loadAI()}
 if(e.target.id==="ai-m"){const v=e.target.value;e.target.blur();if(v==="__other__"){aiOther=true;renderAI()}else{aiOther=false;if(await aiCfg({model:v}))renderAI();else loadAI()}}});
document.addEventListener("click",async e=>{const id=e.target.id;if(id==="ai-r")runAI();
 if(id==="ai-c"&&await aiCfg({clear_key:true})){toast(t("ai.saved"),true);renderAI()}
 if(id==="ai-s"){const sv=$("#ai-m").value,b={model:sv==="__other__"?($("#ai-mc")?$("#ai-mc").value.trim():""):sv};if($("#ai-po"))b.port=+$("#ai-po").value;if($("#ai-k")&&$("#ai-k").value.trim())b.key=$("#ai-k").value.trim();
  if(await aiCfg(b)){aiOther=false;toast(t("ai.saved"),true);document.activeElement.blur();renderAI()}}});
fetch("/api/ai").then(r=>r.json()).then(d=>{ai=d;renderAI()}).catch(()=>{});
setLang(initLang());
</script></body></html>
