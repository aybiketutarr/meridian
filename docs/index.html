const D=[["192.168.1.1","gateway.lan","Linux 5.15",[[22,"ssh","OpenSSH 9.2"],[80,"http","lighttpd 1.4"],[443,"https",""]],false],
["192.168.1.10","nas.lan","Linux 4.x",[[21,"ftp","vsftpd 2.3.4"],[445,"smb","Samba 4.13"],[5000,"http","Synology DSM"],[8080,"http","Apache httpd 2.4.49"]],true],

["192.168.1.42","dev-laptop","Windows 11",[[135,"msrpc",""],[3389,"rdp",""]],false],

["192.168.1.88","","",[],false]];
const demo=(lk,off)=>D.map(([i,n,o,ps,v])=>({ip:i,mac:"",name:n,os:o,vuln:v,

  if(d)x.vulns={mode:lk?"free":"offline",total:d.length,cves:d.length,exploits:d.filter(a=>a.exploit).length,kev:0,items:d};return x})}));

  if([...Object.values(jobs)].some(j=>j.status==="running"))return res(409,{error:"A scan is already running. Stop it first.",code:"busy"});

  jobs[id]=j;let k=0;const t=setInterval(()=>{

   else{if(!K.test(b.key))return res(400,{error:"Invalid device",code:"device"});const e=devices[b.key]=devices[b.key]||{trusted:false,label:""};if("trusted"in b)e.trusted=b.trusted===true;if("label"in b)e.label=String(b.label||"").slice(0,40);if(!e.trusted&&!e.label)delete devices[b.key]}}
  return res(200,{devices})}

 return res(404,{error:"not available in preview"});
};

 md:()=>dl("meridian.md",`# ${t("rep.title")}\n${t("rep.meta",{target:last.target,profile:pname(last.profile)})}\n\n| ${t("rep.t.host")} | ${t("rep.t.os")} | ${t("rep.t.ports")} | ${t("rep.t.risk")} |\n|---|---|---|---|\n`+hosts.map(h=>`| ${mdx(h.ip)} ${mdx(h.name)} | ${mdx(h.os)} | ${h.ports.map(p=>p.port+"/"+mdx(p.service)).join(", ")} | ${score(h)} |`).join("\n")+`\n\n## ${t("rep.findings")}\n`+hosts.flatMap(h=>finds(h).map(f=>`- **${LBL[f.sev]}** ${mdx(f.t)} (${mdx(at(h,f))}): ${mdx(f.fix)}`)).join("\n")+`\n\n## ${t("rep.vulns")}\n`+vulnLines().map(({h,p,i})=>`- ${mdx(h.ip)}:${p.port} ${mdx(p.version)}: ${mdx(i.id)}${i.cvss!=null?" (CVSS "+i.cvss+")":""}${i.exploit?" ["+t("rep.exp")+"]":""}${i.kev?" ["+t("rep.kev")+"]":""}`).join("\n"),"text/markdown"),
 html:()=>dl("meridian.html",`<!doctype html><html lang="${LANG}"><meta charset=utf-8><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'"><title>${esc(t("rep.title"))}</title><style>.p{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;color:#fff}.crit{background:#ff2d55}.high{background:#ff8a3d}.med{background:#d99a00}.low{background:#10b981}body{font:15px system-ui;max-width:920px;margin:30px auto;color:#123}td,th{border:1px solid #cdd;padding:6px;text-align:left}table{border-collapse:collapse;width:100%}</style><h1>${esc(t("rep.title"))}</h1><p>${esc(t("rep.meta",{target:last.target,profile:pname(last.profile)}))}, ${esc(t("rep.hosts",{n:hosts.length}))}</p><table><tr><th>${esc(t("rep.t.host"))}<th>${esc(t("rep.t.os"))}<th>${esc(t("rep.t.ports"))}<th>${esc(t("rep.t.risk"))}</tr>${hosts.map(h=>`<tr><td>${esc(h.ip)} ${esc(h.name)}<td>${esc(h.os)}<td>${h.ports.map(p=>p.port+"/"+esc(p.service)).join(", ")}<td><span class="p ${risk(h)}">${LBL[risk(h)]} ${score(h)}</span>`).join("")}</table><h2>${esc(t("rep.findings"))}</h2><ul>${hosts.flatMap(h=>finds(h).map(f=>`<li><span class="p ${f.sev}">${LBL[f.sev]}</span> ${esc(f.t)} (${esc(at(h,f))}) ${esc(f.fix)}`)).join("")}</ul><h2>${esc(t("rep.vulns"))}</h2><ul>${vulnLines().map(({h,p,i})=>`<li>${esc(h.ip)}:${p.port} ${esc(p.version)}: <a href="${url(i.href)}" rel="noopener noreferrer">${esc(i.id)}</a>${i.cvss!=null?" CVSS "+i.cvss:""}${i.exploit?" ["+esc(t("rep.exp"))+"]":""}${i.kev?" ["+esc(t("rep.kev"))+"]":""}`).join("")}</ul>`,"text/html"),pdf:()=>window.print(),xml:()=>fetch("/api/xml/"+jid).then(r=>r.ok?r.text().then(x=>dl("meridian.xml",x,"application/xml")):toast(t("toast.noxml"))),
 ips:()=>navigator.clipboard.writeText(hosts.map(h=>h.ip).join("\n")).then(()=>toast(t("toast.ips"),true)).catch(()=>dl("meridian-ips.txt",hosts.map(h=>h.ip).join("\n"),"text/plain"))};
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#mn").classList.remove("open")});
$("#mn").querySelector("div").onclick=e=>{const f=e.target.dataset.f;if(f){EX[f]();$("#mn").classList.remove("open")}};
$("#wi").onchange=async e=>{if(!$("#ack").checked){toast(t("watch.auth"));e.target.value="0";return}
 const b={target:$("#t").value,profile:prof==="custom"?"quick":prof,ack:true,minutes:+e.target.value};let r=await api("/api/watch",b),d=await r.json();
 if(r.status===409&&d.error==="public"){if(!confirm(t("confirm.public.w"))){e.target.value="0";return}r=await api("/api/watch",{...b,public_ok:true});d=await r.json()}
 if(!r.ok){toast(emsg(d));e.target.value="0"}else toast(b.minutes?t("watch.started",{target:b.target,m:b.minutes}):t("watch.stopped"),true);pollAl()};
async function pollAl(){try{const a=await (await fetch("/api/alerts")).json();alerts=a.alerts;watches=a.watch;$("#wl").textContent=watches.length?t("watch.now",{list:watches.map(w=>t("watch.every",{target:w.target,m:w.every})).join(", ")}):"";const seq=a.seq??alerts.length,fresh=seen===null?0:Math.min(seq-seen,alerts.length);seen=seq;if(fresh>0){const nw=alerts.slice(-fresh);toast(alertText(nw[nw.length-1]));if(nfOn())nw.forEach(x=>{try{new Notification("Meridian",{body:alertText(x)})}catch(e){}})}render()}catch(e){}}
setInterval(pollAl,20000);pollAl();
$("#auto").onclick=async()=>{const d=await (await fetch("/api/net")).json();$("#t").value=d.cidr};
fetch("/api/history").then(r=>r.json()).then(l=>{$("#rt").innerHTML=[...new Set(l.map(x=>x.target))].map(t=>`<option value="${esc(t)}">`).join("")}).catch(()=>{});
{const lk=$("#lk");lk.checked=false;lk.onchange=async()=>{if(!lk.checked)return;lk.disabled=true;lk.checked=await askLookup();lk.disabled=false}}
(async()=>{try{const d=await (await fetch("/api/net")).json();if(d.cidr&&$("#t").value==="192.168.1.0/24")$("#t").value=d.cidr;
if(d.root===false)toast(t("root.hint."+(d.os||"linux")),true)}catch(e){}})();

function initLang(){let s="";try{s=localStorage.getItem("mr-lang")||""}catch(e){}
 const ks=Object.keys(LOCALES),find=c=>{c=String(c||"").toLowerCase();return ks.find(k=>k.toLowerCase()===c)||ks.find(k=>k.toLowerCase()===c.split("-")[0])};
 for(const c of [s,DEFLANG]){      /* English on first start; only a saved choice or --lang changes it */const m=find(c);if(m)return m}return "en"}
function buildPF(){$("#pf").innerHTML=PF.map(p=>`<button class="pf ${p[2]||""}" aria-pressed="${p[0]==prof}" data-p="${p[0]}"><svg class="i"><use href="#${p[1]}"/></svg><div><b>${esc(t("pf."+p[0]+".n"))}</b><span>${esc(t("pf."+p[0]+".d"))}</span></div></button>`).join("")}
function applyI18n(){document.documentElement.lang=LANG;
 $$("[data-i18n]").forEach(e=>e.textContent=t(e.dataset.i18n));
 $$("[data-i18n-ph]").forEach(e=>e.placeholder=t(e.dataset.i18nPh));
 $$("[data-i18n-title]").forEach(e=>e.title=t(e.dataset.i18nTitle));
 $$("[data-i18n-aria]").forEach(e=>e.setAttribute("aria-label",t(e.dataset.i18nAria)))}
function setLang(c,save){LANG=LOCALES[c]?c:"en";if(save)try{localStorage.setItem("mr-lang",LANG)}catch(e){}
 $("#lang").innerHTML=Object.keys(LOCALES).map(k=>`<option value="${esc(k)}">${esc(LOCALES[k]._name||k)}</option>`).join("");$("#lang").value=LANG;
 applyI18n();buildPF();pr();render();if(!$("#p-his").classList.contains("hide"))loadHis()}
$("#lang").onchange=e=>setLang(e.target.value,true);
async function saveDev(b){try{const r=await api("/api/devices",b),d=await r.json();if(!r.ok){toast(emsg(d));return false}devs=d.devices||{};render();return true}catch(e){return false}}
document.addEventListener("change",e=>{const h=hosts.find(x=>x.ip===sel);if(!h)return;
 if(e.target.id==="dv-t")saveDev({key:devKey(h),trusted:e.target.checked});
 if(e.target.id==="dv-l")saveDev({key:devKey(h),label:e.target.value})});
document.addEventListener("click",e=>{if(e.target.id==="trustall"&&hosts.length)saveDev({trust:hosts.map(devKey)}).then(ok=>ok&&toast(t("dev.baseline.done",{n:hosts.length}),true))});
const nfOn=()=>{try{return localStorage.getItem("mr-notify")==="1"&&"Notification" in window&&Notification.permission==="granted"}catch(e){return false}};
{const nf=$("#nf");nf.checked=nfOn();
 nf.onchange=async()=>{if(!nf.checked){try{localStorage.setItem("mr-notify","0")}catch(e){}return}
  let ok=false;try{ok="Notification" in window&&(Notification.permission==="granted"||await Notification.requestPermission()==="granted")}catch(e){}
  nf.checked=ok;try{localStorage.setItem("mr-notify",ok?"1":"0")}catch(e){}if(!ok)toast(t("watch.notify.denied"))}}
try{$("#ol").checked=localStorage.getItem("mr-offline")==="1"}catch(e){}
fetch("/api/devices").then(r=>r.json()).then(d=>{devs=d.devices||{};render()}).catch(()=>{});
setLang(initLang());
</script></body></html>
